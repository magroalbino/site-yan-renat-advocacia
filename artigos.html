<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigo - Yan Renat Advocacia</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Roboto:wght@400;500&family=Poppins:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body>
    <!-- Cabeçalho (mesmo do index.html) -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo-yan-renat3.jpg"
                        alt="Logotipo do escritório Yan Renat Advocacia e Consultoria Jurídica" class="logo-img">
                </a>
            </div>
            <button class="menu-toggle" aria-label="Toggle Menu"><i class="fas fa-bars"></i></button>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html#sobre">Sobre</a></li>
                    <li><a href="index.html#areas">Áreas de Atuação</a></li>
                    <li><a href="index.html#artigos">Artigos Jurídicos</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="social-top">
                    <a href="https://www.linkedin.com/in/yan-leite/" target="_blank" aria-label="LinkedIn"><i
                            class="fab fa-linkedin"></i></a>
                    <a href="https://www.instagram.com/yanrenat.adv/" target="_blank" aria-label="Instagram"><i
                            class="fab fa-instagram"></i></a>
                    <a href="https://x.com/yanrenatleite" target="_blank" aria-label="X"><i class="fab fa-x"></i></a>
                    <a href="https://www.youtube.com/@DireitoNaPráticaComYanRenat" target="_blank"
                        aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                </div>
                <a href="index.html#contato" class="btn-cta">Fale Conosco</a>
            </div>
        </div>
    </header>

    <!-- WhatsApp Flutuante -->
    <div class="whatsapp-container">
        <a href="https://wa.me/5571994012015" target="_blank" class="whatsapp-float" aria-label="Contato via WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>
        <span class="whatsapp-text">Como posso ajudar?</span>
    </div>

    <!-- Conteúdo do Artigo -->
    <section class="artigo-content">
        <div class="container">
            <h1 id="artigo-titulo">Carregando...</h1>
            <p id="artigo-autor"><em>Publicado em: <span id="artigo-data"></span> por <span
                        id="artigo-autor-nome"></span></em></p>
            <div id="artigo-conteudo"></div>

            <!-- Curtidas -->
            <div class="artigo-meta" style="margin: 30px 0; display: flex; align-items: center; gap: 15px;">
                <button id="btn-curtir" class="btn-leia-mais" data-id="">
                    <i class="far fa-thumbs-up"></i> Curtir
                </button>
                <span id="curtidas-count" style="font-weight: bold;">0</span> curtidas
            </div>

            <hr>

            <!-- Comentários -->
            <div class="comentarios" style="margin-top: 50px;">
                <h2>Comentários</h2>
                <div id="lista-comentarios"></div>

                <div class="comentario-form" style="margin-top: 40px;">
                    <h4>Deixe seu Comentário</h4>
                    <form id="form-comentario">
                        <input type="text" id="comentario-nome" placeholder="Seu Nome" required>
                        <textarea id="comentario-texto" placeholder="Digite seu comentário..." required></textarea>
                        <button type="submit" class="btn-cta">Enviar Comentário</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Yan Renat Advocacia e Consultoria Jurídica. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        const backendUrl = 'https://site-backend-yan-renat-advocacia.vercel.app';
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        let artigoId = null;

        // Elementos
        const tituloEl = document.getElementById('artigo-titulo');
        const conteudoEl = document.getElementById('artigo-conteudo');
        const autorNomeEl = document.getElementById('artigo-autor-nome');
        const dataEl = document.getElementById('artigo-data');
        const curtidasEl = document.getElementById('curtidas-count');
        const btnCurtir = document.getElementById('btn-curtir');
        let curtirEmAndamento = false;

        // ---- Curtir/Descurtir ----

        function atualizarBotaoCurtir() {
            if (!artigoId) return;
            const liked = localStorage.getItem(`like_${artigoId}`) === 'true';
            if (liked) {
                btnCurtir.innerHTML = '<i class="fas fa-thumbs-down"></i> Descurtir';
                btnCurtir.classList.add('descurtir');
            } else {
                btnCurtir.innerHTML = '<i class="far fa-thumbs-up"></i> Curtir';
                btnCurtir.classList.remove('descurtir');
            }
        }

        btnCurtir.addEventListener('click', async function () {
            const id = this.dataset.id;
            if (!id || curtirEmAndamento) return;
            curtirEmAndamento = true;
            btnCurtir.disabled = true;

            const liked = localStorage.getItem(`like_${id}`) === 'true';
            const endpoint = liked ? 'descurtir' : 'curtir';

            try {
                const res = await fetch(`${backendUrl}/api/artigos/${id}/${endpoint}`, { method: 'POST' });

                if (!res.ok) {
                    // Se descurtir falhou com 400 (zero curtidas), corrige o estado local
                    if (res.status === 400 && liked) {
                        localStorage.removeItem(`like_${id}`);
                        atualizarBotaoCurtir();
                        return;
                    }
                    throw new Error('Erro na requisicao');
                }

                const data = await res.json();
                document.getElementById('curtidas-count').textContent = data.curtidas;

                if (liked) {
                    localStorage.removeItem(`like_${id}`);
                } else {
                    localStorage.setItem(`like_${id}`, 'true');
                }
                atualizarBotaoCurtir();
            } catch (err) {
                console.error('Erro ao curtir/descurtir:', err);
                alert('Nao foi possivel realizar a acao.');
            } finally {
                curtirEmAndamento = false;
                btnCurtir.disabled = false;
            }
        });

        // ---- Carregar artigo ----

        async function carregarArtigo() {
            if (!slug) {
                tituloEl.textContent = 'Artigo nao encontrado';
                conteudoEl.innerHTML = '<p>O artigo solicitado nao foi encontrado.</p>';
                return;
            }

            try {
                const response = await fetch(`${backendUrl}/api/artigos/${slug}`);
                if (!response.ok) throw new Error('Artigo nao encontrado');
                const artigo = await response.json();

                // Compatibilidade: se retornar array, pega o primeiro
                const dados = Array.isArray(artigo) ? artigo[0] : artigo;
                if (!dados) throw new Error('Artigo nao encontrado');

                artigoId = dados._id;
                tituloEl.textContent = dados.titulo || 'Titulo nao disponivel';
                autorNomeEl.textContent = dados.autor || 'Yan Renat';
                dataEl.textContent = dados.data ? new Date(dados.data).toLocaleDateString('pt-BR') : '';

                if (dados.conteudo && dados.conteudo.trim().length > 0) {
                    const paragrafos = dados.conteudo.split('\n').filter(p => p.trim() !== '');
                    conteudoEl.innerHTML = paragrafos.map(p => `<p>${p.trim()}</p>`).join('');
                } else {
                    conteudoEl.innerHTML = '<p>Conteudo nao disponivel.</p>';
                }

                curtidasEl.textContent = dados.curtidas || 0;
                btnCurtir.setAttribute('data-id', artigoId);

                // Sincroniza estado do botao com o backend:
                // Se localStorage diz "curtido" mas o artigo tem 0 curtidas, limpa o estado
                const curtidas = dados.curtidas || 0;
                const likedLocal = localStorage.getItem(`like_${artigoId}`) === 'true';
                if (likedLocal && curtidas === 0) {
                    localStorage.removeItem(`like_${artigoId}`);
                }

                atualizarBotaoCurtir();
                carregarComentarios();
            } catch (error) {
                console.error('Erro ao carregar artigo:', error);
                tituloEl.textContent = 'Erro ao carregar';
                conteudoEl.innerHTML = '<p>Nao foi possivel carregar o conteudo do artigo no momento.</p>';
                autorNomeEl.textContent = '';
                dataEl.textContent = '';
                curtidasEl.textContent = '0';
            }
        }

        // ---- Comentarios ----

        // Verifica se o usuario atual e o autor de um comentario
        function temTokenDoComentario(commentId) {
            return !!localStorage.getItem(`comment_token_${commentId}`);
        }

        async function carregarComentarios() {
            const lista = document.getElementById('lista-comentarios');
            if (!lista) return;

            try {
                const response = await fetch(`${backendUrl}/api/comentarios/${slug}`);
                if (!response.ok) throw new Error('Erro ao buscar comentarios');
                const data = await response.json();
                const comentarios = data.comments || data;

                if (!comentarios || comentarios.length === 0) {
                    lista.innerHTML = '<p>Nenhum comentario ainda. Seja o primeiro a comentar!</p>';
                    return;
                }

                lista.innerHTML = comentarios.map(c => {
                    // So mostra o botao de excluir se o usuario for o autor do comentario
                    const podeExcluir = temTokenDoComentario(c._id);
                    const btnExcluir = podeExcluir
                        ? `<button class="btn-excluir-comentario" data-id="${c._id}" title="Excluir comentario">
                     <i class="fas fa-trash-alt"></i>
                   </button>`
                        : '';

                    return `
                <div class="comentario" id="com-${c._id}">
                    <div class="comentario-header">
                        <strong>${c.nome || 'Anonimo'}</strong>
                        <small>${c.data ? new Date(c.data).toLocaleString('pt-BR') : ''}</small>
                        ${btnExcluir}
                    </div>
                    <p>${c.texto || c.conteudo || ''}</p>
                </div>
            `;
                }).join('');

                document.querySelectorAll('.btn-excluir-comentario').forEach(botao => {
                    botao.addEventListener('click', excluirComentario);
                });
            } catch (error) {
                console.error('Erro ao carregar comentarios:', error);
                lista.innerHTML = '<p>Erro ao carregar comentarios.</p>';
            }
        }

        // Exclui comentario enviando o autorToken no header
        async function excluirComentario(e) {
            const btn = e.currentTarget;
            const id = btn.dataset.id;
            if (!confirm('Tem certeza que deseja excluir este comentario?')) return;

            const autorToken = localStorage.getItem(`comment_token_${id}`);
            if (!autorToken) {
                alert('Voce nao tem permissao para excluir este comentario.');
                return;
            }

            try {
                const res = await fetch(`${backendUrl}/api/comentarios/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-autor-token': autorToken
                    }
                });

                if (res.ok) {
                    localStorage.removeItem(`comment_token_${id}`);
                    const comentarioDiv = document.getElementById(`com-${id}`);
                    if (comentarioDiv) comentarioDiv.remove();

                    const lista = document.getElementById('lista-comentarios');
                    if (lista && lista.children.length === 0) {
                        lista.innerHTML = '<p>Nenhum comentario ainda. Seja o primeiro a comentar!</p>';
                    }
                } else {
                    const data = await res.json().catch(() => ({}));
                    alert(data.error || 'Erro ao excluir comentario.');
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexao.');
            }
        }

        // Cria comentario e salva o autorToken no localStorage
        document.getElementById('form-comentario').addEventListener('submit', async function (e) {
            e.preventDefault();
            if (!artigoId) return;

            const nome = document.getElementById('comentario-nome').value.trim();
            const texto = document.getElementById('comentario-texto').value.trim();
            if (!nome || !texto) return;

            const btn = document.querySelector('#form-comentario button');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const response = await fetch(`${backendUrl}/api/comentarios/${slug}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, texto })
                });

                if (response.ok) {
                    const data = await response.json();

                    // Salva o token do autor para poder excluir depois
                    if (data.autorToken && data.comment && data.comment._id) {
                        localStorage.setItem(`comment_token_${data.comment._id}`, data.autorToken);
                    }

                    document.getElementById('form-comentario').reset();
                    carregarComentarios();
                } else {
                    alert('Erro ao enviar comentario.');
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexao.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Comentario';
            }
        });

        // ---- Menu mobile ----
        const menuToggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.nav');
        if (menuToggle && nav) {
            menuToggle.addEventListener('click', () => nav.classList.toggle('active'));
        }

        // ---- Iniciar ----
        carregarArtigo();
    </script>
</body>

</html>
